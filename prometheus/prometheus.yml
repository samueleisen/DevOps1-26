global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # node-exporter runs with network_mode: host to report real host metrics,
  # so it is reached through the host gateway rather than a service name.
  - job_name: node-exporter
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # Gatus exposes probe results at /metrics (enabled via `metrics: true`).
  - job_name: gatus
    static_configs:
      - targets: ["gatus:8080"]
