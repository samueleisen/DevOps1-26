metrics: true

ui:
  title: DevOps-26 Status
  header: DevOps-26 Status

# Incident webhook: Gatus -> GitHub repository_dispatch -> Actions workflow.
# ${...} values are substituted by Gatus from the container environment (see docker-compose.yml).
alerting:
  custom:
    url: "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches"
    method: POST
    headers:
      Accept: application/vnd.github+json
      Authorization: "Bearer ${GITHUB_DISPATCH_TOKEN}"
      X-GitHub-Api-Version: "2022-11-28"
    body: |
      {
        "event_type": "gatus-incident",
        "client_payload": {
          "endpoint_name": "[ENDPOINT_NAME]",
          "endpoint_group": "[ENDPOINT_GROUP]",
          "endpoint_url": "[ENDPOINT_URL]",
          "alert_description": "[ALERT_DESCRIPTION]",
          "status": "[ALERT_TRIGGERED_OR_RESOLVED]"
        }
      }
    default-alert:
      failure-threshold: 3   # ~90s on 30s probes; absorbs one-off blips
      success-threshold: 2
      send-on-resolved: true

endpoints:
  - name: Prometheus
    group: Monitoring Stack
    url: http://prometheus:9090/-/healthy
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 500"
    alerts:
      - type: custom
        description: "Prometheus health check failing"

  - name: Grafana
    group: Monitoring Stack
    url: http://grafana:3000/api/health
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].database == ok"
      - "[RESPONSE_TIME] < 500"
    alerts:
      - type: custom
        description: "Grafana health check failing"

  - name: Node Exporter
    group: Monitoring Stack
    url: http://host.docker.internal:9100/metrics
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Node Exporter is not responding"

  - name: GitHub
    group: External
    url: https://github.com
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
    alerts:
      - type: custom
        description: "GitHub is unreachable or slow"

  - name: samueleisen.com
    group: External
    url: https://samueleisen.com
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
    alerts:
      - type: custom
        description: "samueleisen.com is down or slow"
